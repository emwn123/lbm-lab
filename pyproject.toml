[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lbm-flow-lab"
version = "0.2.0"
description = "Three D2Q9 flow benchmarks with analytical references"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.scripts]
lbm-lab = "lbm_lab.cases:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
