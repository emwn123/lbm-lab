name: Bug report / 问题报告
description: Report a reproducible installation, browser or numerical problem / 报告可复现的问题
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or command / 重现步骤或命令
      description: Include the case and parameters / 请包含算例和参数
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      description: Error message, numerical report or screenshot; remove private data / 可附报错、报告或截图，请删除私有信息
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Browser or Python/NumPy version, operating system and project version / 浏览器或 Python、NumPy 版本，操作系统及项目版本
    validations:
      required: true
